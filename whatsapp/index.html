<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp'a Yönlendiriliyorsunuz...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f7f2;
      color: #222;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 360px;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    a {
      display: block;
      margin-top: 16px;
      background: #1D9E75;
      color: white;
      text-decoration: none;
      padding: 13px 16px;
      border-radius: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="icon">💬</div>
    <h1>WhatsApp'a yönlendiriliyorsunuz</h1>
    <p>
      Online sipariş vermek için WhatsApp üzerinden bize ulaşabilirsiniz.
    </p>

    <a id="wa-link" href="#">
      WhatsApp'ı Aç
    </a>
  </div>

  <script>
    const phone = "905334007017"

    const message = "Merhaba, online sipariş vermek istiyorum."
    const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`

    document.getElementById("wa-link").href = whatsappUrl

    setTimeout(() => {
      window.location.href = whatsappUrl
    }, 700)
  </script>

</body>
</html>
